<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immanuella Iyawe | Data Analyst Portfolio</title>
    <meta
      name="description"
      content="Portfolio website for Immanuella Iyawe, a data analyst focused on reporting, stakeholder analysis, data quality, and business-facing analytics."
    />
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --chip: #f1f5f9;
        --accent: #111827;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .container {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }
      .section {
        padding: 72px 0;
      }
      .section-soft {
        background: var(--bg-soft);
      }
      .hero {
        background: linear-gradient(to bottom, #f8fafc, #ffffff);
        border-bottom: 1px solid var(--border);
      }
      .hero-grid,
      .about-grid,
      .skills-grid,
      .cta-grid {
        display: grid;
        gap: 32px;
      }
      .hero-grid {
        grid-template-columns: 1.2fr 0.8fr;
        align-items: center;
      }
      .about-grid {
        grid-template-columns: 0.9fr 1.1fr;
      }
      .skills-grid {
        grid-template-columns: 0.8fr 1.2fr;
      }
      .cta-grid {
        grid-template-columns: 1fr auto;
        align-items: center;
      }
      .badge {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--border);
        font-size: 14px;
        font-weight: 600;
      }
      h1 {
        font-size: clamp(2.4rem, 5vw, 4.5rem);
        line-height: 1.02;
        margin: 0;
        letter-spacing: -0.03em;
      }
      h2 {
        font-size: clamp(1.8rem, 3vw, 2.25rem);
        line-height: 1.15;
        margin: 0;
        letter-spacing: -0.02em;
      }
      h3 {
        margin: 0;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 12px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .buttons,
      .contact-row,
      .chip-wrap,
      .footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 20px;
        border-radius: 18px;
        border: 1px solid var(--border);
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .btn-secondary {
        background: #fff;
        color: var(--text);
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      }
      .mini-grid,
      .services-grid,
      .projects-grid {
        display: grid;
        gap: 20px;
      }
      .mini-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .services-grid,
      .projects-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .mini-stat,
      .soft-box,
      .project-impact {
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
      }
      .soft-box,
      .project-impact {
        background: var(--bg-soft);
      }
      .mini-label {
        color: #64748b;
        font-size: 14px;
      }
      .mini-value {
        margin-top: 8px;
        font-weight: 700;
      }
      .project-card,
      .service-card {
        height: 100%;
      }
      .project-card .stack,
      .service-card .stack {
        height: 100%;
      }
      .project-link {
        margin-top: auto;
        font-weight: 600;
        color: var(--text);
      }
      .chip {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--border);
        font-size: 14px;
      }
      .footer {
        border-top: 1px solid var(--border);
        padding: 28px 0;
      }
      .footer-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
      }
      @media (max-width: 900px) {
        .hero-grid,
        .about-grid,
        .skills-grid,
        .cta-grid,
        .services-grid,
        .projects-grid {
          grid-template-columns: 1fr;
        }
        .mini-grid {
          grid-template-columns: 1fr;
        }
        .footer-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
